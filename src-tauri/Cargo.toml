[package]
name = "mini-mail"
version = "0.1.0"
edition = "2021"

[lib]
name = "mini_mail_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-notification = "2"
tokio = { version = "1", features = ["time"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
# native-tls: system TLS and the system certificate store (corporate CA, old IIS)
reqwest = { version = "0.12", default-features = false, features = ["native-tls", "cookies"] }
roxmltree = "0.20"
base64 = "0.22"
keyring = { version = "3", features = ["apple-native"] }
